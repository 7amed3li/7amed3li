<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Hamed Mohamed GitHub profile statistics</title>
  <desc id="desc">Twenty-six public repositories, five followers, six following, and a focus on Node.js, TypeScript, React, and application security.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4493f8"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <style>
      .label { fill:#8b949e; font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .value { fill:#f0f6fc; font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .heading { fill:#f0f6fc; font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .small { fill:#8b949e; font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="228" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="6" height="228" rx="3" fill="url(#accent)"/>
  <text x="34" y="42" class="heading">GitHub Profile Overview</text>
  <text x="34" y="65" class="small">Building reliable software and practical security tooling</text>
  <line x1="34" y1="84" x2="866" y2="84" stroke="#30363d"/>
  <g transform="translate(34,112)">
    <text x="0" y="0" class="value">26</text>
    <text x="0" y="25" class="label">Public repositories</text>
  </g>
  <g transform="translate(245,112)">
    <text x="0" y="0" class="value">5</text>
    <text x="0" y="25" class="label">Followers</text>
  </g>
  <g transform="translate(425,112)">
    <text x="0" y="0" class="value">6</text>
    <text x="0" y="25" class="label">Following</text>
  </g>
  <g transform="translate(592,107)">
    <circle cx="8" cy="8" r="7" fill="#4493f8"/>
    <text x="27" y="14" class="label">Core focus</text>
    <text x="0" y="39" class="small">Node.js · TypeScript · React</text>
    <text x="0" y="60" class="small">Backend · Application Security</text>
  </g>
  <text x="34" y="205" class="small">github.com/7amed3li</text>
  <text x="866" y="205" text-anchor="end" class="small">Tokat, Turkey</text>
</svg>
