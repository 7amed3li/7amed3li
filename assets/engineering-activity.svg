<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Engineering activity</title>
  <desc id="desc">A visual representation of consistent engineering activity and open-source contribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111c2e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <style>
      .title { fill:#f0f6fc; font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .sub { fill:#8b949e; font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="178" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="6" height="178" rx="3" fill="url(#accent)"/>
  <text x="40" y="62" class="title">Engineering Activity</text>
  <text x="40" y="91" class="sub">Production systems · open-source security · continuous improvement</text>
  <g transform="translate(40,120)" opacity="0.95">
    <rect width="18" height="18" rx="3" fill="#0e4429"/><rect x="25" width="18" height="18" rx="3" fill="#006d32"/><rect x="50" width="18" height="18" rx="3" fill="#26a641"/><rect x="75" width="18" height="18" rx="3" fill="#39d353"/>
    <rect x="110" width="18" height="18" rx="3" fill="#161b22"/><rect x="135" width="18" height="18" rx="3" fill="#0e4429"/><rect x="160" width="18" height="18" rx="3" fill="#006d32"/><rect x="185" width="18" height="18" rx="3" fill="#26a641"/><rect x="210" width="18" height="18" rx="3" fill="#39d353"/>
    <rect x="245" width="18" height="18" rx="3" fill="#0e4429"/><rect x="270" width="18" height="18" rx="3" fill="#006d32"/><rect x="295" width="18" height="18" rx="3" fill="#26a641"/><rect x="320" width="18" height="18" rx="3" fill="#39d353"/>
  </g>
  <g transform="translate(730,53)"><circle cx="8" cy="8" r="8" fill="#58a6ff"/><text x="28" y="14" class="sub">Building software that matters</text><circle cx="8" cy="45" r="8" fill="#26a641"/><text x="28" y="51" class="sub">Learning, shipping, improving</text></g>
</svg>
